name: Espejo automatico a GitLab

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar llave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GL_SSH_KEY }}
      - name: Registrar host de GitLab
        run: ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
      - name: Sincronizar con GitLab
      run: git push --force "git@gitlab.com:Alitopro/${{ github.event.repository.name }}.git" "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"
